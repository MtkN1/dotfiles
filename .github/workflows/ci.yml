name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Test shell script syntax
      run: |
        echo "Testing shell script syntax..."
        for script in $(find src -name "*.sh" -type f); do
          echo "Checking $script"
          bash -n "$script"
        done
        echo "All shell scripts have valid syntax"
    
    - name: Test Python script syntax
      run: |
        echo "Testing Python script syntax..."
        for script in $(find src -name "*.py" -type f); do
          echo "Checking $script"
          python3 -m py_compile "$script"
        done
        echo "All Python scripts have valid syntax"
